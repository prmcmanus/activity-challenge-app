# Builds the iPhone app on a macOS runner (this needs a Mac; the repo is developed on Windows).
# Produces an unsigned-for-distribution .ipa as an artifact: it is ad-hoc signed with the app's
# entitlements (Apple Health), and Sideloadly re-signs it with a personal Apple ID to install.
name: iOS app
on:
  push:
    paths: ["companion/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: companion/ios
        run: xcodegen generate
      - name: Build
        working-directory: companion/ios
        run: |
          set -o pipefail
          xcodebuild -project ActiveTogether.xcodeproj -scheme ActiveTogether -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)"
          # A failed compile can still leave an .app folder behind, so check for the app's executable.
          test -x build/Build/Products/Release-iphoneos/ActiveTogether.app/ActiveTogether
      - name: Package the .ipa
        working-directory: companion/ios
        run: |
          APP=build/Build/Products/Release-iphoneos/ActiveTogether.app
          # Ad-hoc signature carrying the entitlements, so a re-sign keeps Apple Health access.
          codesign --force --sign - --entitlements ActiveTogetherCompanion.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr ActiveTogether.ipa Payload
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" > version.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" > build.txt
          echo "Built version $(cat version.txt) ($(cat build.txt))"
      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ActiveTogether-ipa
          path: |
            companion/ios/ActiveTogether.ipa
            companion/ios/version.txt
            companion/ios/build.txt
          retention-days: 30
      # A public download for any PC: the newest .ipa on the "Latest app builds" release (the Android .apk goes there too).
      - name: Publish to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: companion/ios
        run: |
          gh release view latest-apps >/dev/null 2>&1 || gh release create latest-apps --title "Latest app builds" \
            --notes "Newest builds of the Active Together apps. iPhone: install ActiveTogether.ipa with Sideloadly (see companion/ios/README.md). Android: install ActiveTogether.apk." --latest
          gh release upload latest-apps ActiveTogether.ipa --clobber
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: companion/ios/build.log
          retention-days: 7
