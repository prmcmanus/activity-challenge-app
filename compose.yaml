# Each container's log is capped (3 files of 10 MB), however long it runs between deploys.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  activity-challenge:
    build: .
    # Published on this machine only by default: the tunnel reaches the app over the compose network, so
    # nothing else needs the port. Set HTTP_BIND=0.0.0.0 to reach it from the local network (a test instance).
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      SHORTCUT_URL: ${SHORTCUT_URL:-}
      # Password reset emails through Resend (resend.com); without a key, admins make reset links instead.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Active Together <no-reply@activetogether.team>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@activetogether.team}
      # Bot check: Cloudflare Turnstile once both keys are set (otherwise reCAPTCHA, if its keys are set).
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Sign in with Google (web client ID; iOS client ID for the iPhone app) and Apple (Services ID for the website).
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      # Emergency only: turns off two-step sign-in for this email at start-up. Remove it again afterwards.
      CLEAR_TWO_FACTOR_FOR: ${CLEAR_TWO_FACTOR_FOR:-}
      # Encrypts two-step secrets in the database (32 random bytes, base64). The standby must have the same key.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Global admins need two-step sign-in for their powers ("optional" turns that off - for testing only).
      ADMIN_TWO_FACTOR: ${ADMIN_TWO_FACTOR:-required}
      # Phone notifications - Android (Firebase): the service account JSON key and the Android app's Firebase details.
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      FCM_ANDROID_APP_ID: ${FCM_ANDROID_APP_ID:-}
      FCM_API_KEY: ${FCM_API_KEY:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      # - iPhone (Apple push): the .p8 key (base64), its key ID and the team ID.
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      PUSH_HOUR: ${PUSH_HOUR:-8}
      # Map tiles and place search from a provider (defaults: OpenStreetMap's own, and Nominatim).
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
      GEOCODER_BASE: ${GEOCODER_BASE:-}
      GEOCODER_KEY: ${GEOCODER_KEY:-}
      GEOCODER_GAP_MS: ${GEOCODER_GAP_MS:-}
      # Store listings: PLAY_STORE_LIVE=1 once anyone can install from Google Play; APP_STORE_URL once the App Store listing is live.
      PLAY_STORE_LIVE: ${PLAY_STORE_LIVE:-}
      APP_STORE_URL: ${APP_STORE_URL:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-30}
      UPLOAD_RATE_LIMIT_WINDOW_MS: ${UPLOAD_RATE_LIMIT_WINDOW_MS:-900000}
    volumes:
      - activity_data:/data
    restart: unless-stopped
    logging: *logging
    # Answers and can read its database; the guard (tools/standby/guard.sh) restarts it if this fails.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Time for requests in progress to finish when stopping (the app waits up to 10 seconds).
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.5

  # The services below only run on the live ("primary") machine of a primary/standby pair, and are
  # started and stopped by tools/standby/takeover.sh rather than by a plain `docker compose up`.
  # See "Standby machine and failover" in README.md.

  # Streams every database change to Cloudflare R2, under this machine's current epoch.
  litestream:
    image: litestream/litestream:0.5.17
    profiles: [primary]
    command: replicate -config /etc/litestream.yml
    user: "1000:1000"
    environment: &r2
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    env_file:
      - path: .standby.env
        required: false
    configs:
      - source: litestream
        target: /etc/litestream.yml
    volumes:
      - activity_data:/data
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

  # Mirrors uploaded images and the app downloads to R2 every minute, and once more when stopped. A file
  # deleted here (an image nothing uses any more) moves to deleted/<date> in R2, which prune.sh empties after
  # 30 days; --max-delete stops a mirror that would delete a lot at once (say, an empty data volume).
  files-sync:
    image: rclone/rclone:1.75.1
    profiles: [primary]
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sync() { rclone sync /data "r2:$$R2_BUCKET/$$STANDBY_EPOCH/files" --include "/uploads/**" --include "/downloads/**" --backup-dir "r2:$$R2_BUCKET/$$STANDBY_EPOCH/deleted/$$(date -u +%Y%m%d)" --max-delete 1000; }
        trap 'sync; exit 0' TERM INT
        while :; do sync; sleep 60 & wait $$!; done
    environment:
      <<: *r2
      HOME: /tmp
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    env_file:
      - path: .standby.env
        required: false
    volumes:
      - activity_data:/data
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

  # Cloudflare tunnel dedicated to this app; its public hostnames point at http://activity-challenge:3000.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [primary]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

configs:
  litestream:
    content: |
      snapshot:
        interval: 24h
        retention: 168h
      dbs:
        - path: /data/activity.sqlite
          replica:
            type: s3
            bucket: $${R2_BUCKET}
            path: $${STANDBY_EPOCH}/db
            endpoint: $${R2_ENDPOINT}
            region: auto
            access-key-id: $${R2_ACCESS_KEY_ID}
            secret-access-key: $${R2_SECRET_ACCESS_KEY}
            force-path-style: true
            sync-interval: 1s

volumes:
  activity_data:
