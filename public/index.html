<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Together</title><link rel="stylesheet" href="style.css"></head><body><header><div><span class="mark">AT</span><b>Active Together</b></div><button id="logout" class="ghost hidden">Sign out</button></header><main>
<section id="login" class="card narrow"><h1>Activity challenges, together</h1><p>Sign in to log activity time and support your team.</p><form id="loginForm"><label>Email<input id="email" type="email" required value="admin@example.com"></label><label>Password<input id="password" type="password" required value="ChangeMe123!"></label><button>Sign in</button></form><p id="loginMsg" class="error"></p></section>
<div id="app" class="hidden"><section class="hero"><div><p class="eyebrow">TEAM ACTIVITY CHALLENGE</p><h1 id="hello"></h1><p>Every active minute moves your team forward.</p></div><div class="metric"><b id="myMinutes">0</b><span>minutes logged</span></div></section>
<div class="grid"><section class="card"><h2>Log activity</h2><form id="activityForm"><label>Team<select id="team"></select></label><label>Challenge<select id="challenge"></select></label><label>Activity<input id="activityType" placeholder="Walking, cycling, gym..." required></label><div class="two"><label>Minutes<input id="minutes" type="number" min="1" required></label><label>Date<input id="activityDate" type="date" required></label></div><button>Save activity</button></form></section>
<section class="card"><h2>Team leaderboard</h2><div id="leaderboard"></div></section></div>
<section class="card"><div class="row"><h2>Recent activity</h2><button id="health" class="secondary">Device sync information</button></div><div id="recent"></div></section>
<section id="admin" class="card hidden"><h2>Administration</h2><div class="tabs"><button data-tab="users">Users</button><button data-tab="teams">Teams & invites</button><button data-tab="challenges">Challenges</button></div><div id="adminPanel"></div></section></div></main><dialog id="modal"><button class="close" onclick="this.closest('dialog').close()">×</button><div id="modalBody"></div></dialog><script src="app.js"></script></body></html>
